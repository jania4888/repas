# FactuTrust — stack Docker production (Hostinger VPS Ubuntu)
# Usage depuis la racine du dépôt :
#   cp deploy/.env.example deploy/.env   # puis éditer
#   bash deploy/scripts/init-secrets.sh  # AVANT le premier up (voir DATAPROTECTION ci-dessous)
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Derrière le Traefik du VPS Hostinger, superposer deploy/docker-compose.vps.yml :
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.vps.yml up -d

name: factutrust

# Rotation des journaux Docker. Sans elle, `docker logs` grossit sans fin sur un hôte
# de production et finit par remplir /var/lib/docker.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: factutrust-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    volumes:
      - sqlserver-data:/var/opt/mssql
      # Voir le commentaire du volume `tenant-provisioning` en bas de fichier.
      - tenant-provisioning:/var/opt/mssql/provisioning
      # Destination des BACKUP DATABASE. Volume DÉDIÉ, pas le répertoire de données :
      # deploy/scripts/backup.sh y écrit puis purge après extraction vérifiée.
      - sqlserver-backups:/var/opt/mssql/backups
    networks:
      - factutrust-net
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s

  ollama:
    image: ollama/ollama:latest
    container_name: factutrust-ollama
    environment:
      # 2 par défaut (aligné sur .env.example) : l'assistant et le modèle d'import/vision
      # cohabitent au lieu de s'évincer à chaque appel. Ne pas monter à 3 (conteneur 12 Go).
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - factutrust-net
    restart: unless-stopped
    logging: *default-logging
    # 32 Go RAM : exposer Ollama uniquement sur le réseau Docker interne
    expose:
      - "11434"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: factutrust-api
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__MasterConnection: "Server=sqlserver,1433;Database=FactuTrust_Master;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true;Encrypt=True"
      ConnectionStrings__DefaultTenantConnection: "Server=sqlserver,1433;Database=FactuTrust_Tenant_Default;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true;Encrypt=True"
      Ollama__BaseUrl: http://ollama:11434
    volumes:
      - api-wwwroot:/app/wwwroot
      - api-appdata:/app/App_Data
      - api-logs:/app/logs
      - api-whatsapp-session:/app/whatsapp-session
      # ATTENTION : bind de FICHIER. Si dataprotection.pfx n'existe pas, Docker crée un
      # RÉPERTOIRE vide à sa place et l'API lève au démarrage (X509Certificate2 sur un
      # répertoire). init-secrets.sh DOIT tourner avant le premier `up`.
      - ${DATAPROTECTION_CERT_HOST_PATH:-./certs/dataprotection.pfx}:/app/certs/dataprotection.pfx:ro
      # Lecture seule : l'API ne fait que File.Exists / lecture du .bak de template,
      # c'est SQL Server qui l'écrit. Même chemin des deux côtés, voir plus bas.
      - tenant-provisioning:/var/opt/mssql/provisioning:ro
    depends_on:
      sqlserver:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - factutrust-net
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 20
      # 63 migrations master sur un SQL Server froid ne tiennent pas en 2 minutes. Un
      # `unhealthy` prématuré est exactement la situation où un opérateur redémarre le
      # conteneur AU MILIEU d'un MigrateAsync.
      #
      # RAPPEL : /health/ready ne fait qu'un SELECT 1 sur la base master. Il répond
      # « Healthy » sur une base à MOITIÉ migrée, parce qu'en Production une migration
      # en échec est journalisée et avalée (Program.cs). La porte de déploiement est le
      # grep de « FATAL: » dans les journaux de l'API, jamais cette sonde.
      start_period: 300s

  web-static-init:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      target: export
    container_name: factutrust-web-static-init
    volumes:
      - web-static:/out
    entrypoint: ["/bin/sh", "-c", "rm -rf /out/* && cp -a /dist/. /out/ && echo 'Web static copied'"]
    networks:
      - factutrust-net
    restart: "no"
    logging: *default-logging

  admin-static-init:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backoffice
      target: export
    container_name: factutrust-admin-static-init
    volumes:
      - admin-static:/out
    entrypoint: ["/bin/sh", "-c", "rm -rf /out/* && cp -a /dist/. /out/ && echo 'Backoffice static copied'"]
    networks:
      - factutrust-net
    restart: "no"
    logging: *default-logging

  nginx:
    image: nginx:alpine
    container_name: factutrust-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - web-static:/usr/share/nginx/html/app:ro
      - admin-static:/usr/share/nginx/html/admin:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      web-static-init:
        condition: service_completed_successfully
      admin-static-init:
        condition: service_completed_successfully
    networks:
      - factutrust-net
    restart: unless-stopped
    logging: *default-logging

networks:
  factutrust-net:
    driver: bridge

volumes:
  sqlserver-data:
  ollama-models:
  api-wwwroot:
  api-appdata:
  api-logs:
  api-whatsapp-session:
  web-static:
  admin-static:
  sqlserver-backups:
  # Sauvegarde .bak du template de dossier, partagée entre l'API et SQL Server AU MÊME
  # CHEMIN. Sans ce partage, deux chemins de code cassent :
  #   1. la stratégie TemplateClone (l'API teste File.Exists sur un chemin qui n'existe
  #      que dans SON conteneur, alors que BACKUP/RESTORE TO DISK s'exécute dans celui
  #      de SQL Server) ;
  #   2. le job Hangfire hebdomadaire `tenant-template-maintenance` (dimanche 02:00 UTC),
  #      qui appelle EnsureTenantTemplateAsync SANS regarder TenantProvisioning:Strategy
  #      et RELANCE l'exception : 178 migrations puis erreur SQL 3201, 10 relances, base
  #      orpheline — chaque semaine, même en stratégie Migrate.
  # Les chemins se règlent par TenantProvisioning__TemplateBackupPath et __DataFileDirectory
  # dans .env. Docker crée la racine du volume en root:root alors que mssqld tourne en
  # uid 10001 : après le premier `up`, exécuter une fois
  #   docker compose ... exec -u 0 sqlserver chown mssql:root /var/opt/mssql/provisioning
  tenant-provisioning:
