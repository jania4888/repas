<app-auth-shell [config]="shellConfig">
  <div class="auth-form-top-link" i18n="@@auth.forgot-password.retour.a.la.connexion.f3779e87">
    <a routerLink="/auth/login">
      <i class="pi pi-arrow-left" aria-hidden="true"></i>
      Retour à la connexion
    </a>
  </div>

  <div class="auth-form-card-header">
    <h2 i18n="@@auth.forgot-password.mot.de.passe.oublie.806ef9d4">Mot de passe oublié</h2>
    <p i18n="@@auth.forgot-password.indiquez.votre.adresse.email.pour.recevoir.un.li.4a096288">Indiquez votre adresse email pour recevoir un lien de réinitialisation.</p>
  </div>

  @if (submitted()) {
    <p-message
      severity="success"
      text="Si un compte existe avec cette adresse email, un lien de réinitialisation a été envoyé. Vérifiez votre boîte de réception." i18n-text="@@auth.forgot-password.si.un.compte.existe.avec.cette.adresse.e.16d89b0f"
      styleClass="w-full forgot-success-message"
    ></p-message>
    <p class="forgot-back-link">
      <a routerLink="/auth/login" i18n="@@auth.forgot-password.retour.a.la.connexion.dfad5972">Retour à la connexion</a>
    </p>
  } @else {
    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      class="login-form"
      aria-label="Demande de réinitialisation du mot de passe" i18n-aria-label="@@auth.forgot-password.demande.de.reinitialisation.du.mot.de.passe.32076fff"
      novalidate
    >
      @if (error()) {
        <p-message severity="error" [text]="error()!" styleClass="w-full login-global-error"></p-message>
      }

      <div class="form-group">
        <label for="forgot-email" i18n="@@auth.forgot-password.adresse.email.bdf1cc95">Adresse email</label>
        <div class="input-icon-wrapper">
          <i class="pi pi-envelope icon" aria-hidden="true"></i>
          <input
            pInputText
            id="forgot-email"
            type="email"
            formControlName="email"
            placeholder="Entrez votre adresse email" i18n-placeholder="@@auth.forgot-password.entrez.votre.adresse.email.f0d096b5"
            class="w-full"
            autocomplete="email"
            [attr.aria-invalid]="isEmailInvalid()"
            [attr.aria-describedby]="isEmailInvalid() ? 'forgot-email-error' : null"
            [class.ng-invalid]="isEmailInvalid()"
          />
        </div>
        @if (isEmailInvalid()) {
          <div class="field-error" id="forgot-email-error" role="alert">
            <i class="pi pi-info-circle" aria-hidden="true"></i>
            <span>{{ errorMessageService.getErrorMessage(form.get('email')) }}</span>
          </div>
        }
      </div>

      <p-button
        type="submit"
        label="Envoyer le lien" i18n-label="@@auth.forgot-password.envoyer.le.lien.0962469b"
        icon="pi pi-send"
        iconPos="right"
        styleClass="w-full login-submit-btn"
        [loading]="loading()"
        [disabled]="form.invalid || loading()"
        [attr.aria-busy]="loading()"
      >
      </p-button>
    </form>
  }
</app-auth-shell>
