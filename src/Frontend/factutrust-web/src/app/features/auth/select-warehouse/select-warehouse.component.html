<app-auth-shell [config]="shellConfig">
  <div class="form-header-text">
    <h2 i18n="@@auth.select-warehouse.entrepot.c349c0bc">Entrepôt</h2>
    <p i18n="@@auth.select-warehouse.votre.compte.a.plusieurs.entrepots.actifs.lequel.8ac3cc62">Votre compte a plusieurs entrepôts actifs. Lequel souhaitez-vous utiliser ?</p>
  </div>

  @if (loading()) {
    <p class="warehouse-loading" role="status" aria-live="polite" i18n="@@auth.select-warehouse.chargement.des.entrepots.7f9e9f39">Chargement des entrepôts…</p>
  } @else if (error()) {
    <p-message severity="error" [text]="error()!" styleClass="w-full"></p-message>
  } @else {
    <div
      class="warehouse-fieldset"
      role="radiogroup"
      [attr.aria-label]="'Choisir un entrepôt actif'"
    >
      @for (w of warehouses(); track w.id) {
        <button
          type="button"
          class="warehouse-option"
          [class.warehouse-option--selected]="selectedId === w.id"
          [class.warehouse-option--default]="w.isDefault"
          [attr.aria-checked]="selectedId === w.id"
          role="radio"
          [attr.aria-labelledby]="'wh-label-' + w.id"
          (click)="selectedId = w.id"
          (keydown.enter)="selectedId = w.id"
          (keydown.space)="$event.preventDefault(); selectedId = w.id"
        >
          <span class="warehouse-option__radio" aria-hidden="true"></span>
          <span class="warehouse-option__text" [id]="'wh-label-' + w.id">
            <span class="warehouse-option__name">{{ w.name }}</span>
            @if (w.isDefault) {
              <span class="warehouse-option__badge" i18n="@@auth.select-warehouse.par.defaut.4550c68e">Par défaut</span>
            }
            @if (w.code) {
              <span class="warehouse-option__code">{{ w.code }}</span>
            }
          </span>
        </button>
      }
    </div>

    <p-button
      type="button"
      label="Continuer"
      icon="pi pi-arrow-right"
      iconPos="right"
      styleClass="w-full login-submit-btn"
      [disabled]="!selectedId"
      (onClick)="confirm()"
    />
  }
</app-auth-shell>
