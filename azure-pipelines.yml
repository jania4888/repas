trigger:
  - main
  - master

pool:
  vmImage: ubuntu-latest

# Conteneur de service SQL Server pour les tests backend (tâche 5, plan §Câblage CI) : les tests
# d'atomicité/concurrence de FactuTrust.Infrastructure.Tests (SqlTestDatabase + 6 classes SQL
# existantes) ont besoin d'un vrai moteur SQL Server (LocalDB n'existe pas sous Linux). Mappé sur
# localhost:1433 par Azure Pipelines (mécanisme "service container" standard).
resources:
  containers:
    - container: mssql
      image: mcr.microsoft.com/mssql/server:2022-latest
      env:
        ACCEPT_EULA: 'Y'
        MSSQL_SA_PASSWORD: $(SqlSaPassword)
      ports:
        - 1433:1433

services:
  mssql: mssql

variables:
  TRUNK_ORG_URL_SLUG: instafact
  # SqlSaPassword : variable secrète à définir dans les paramètres du pipeline Azure DevOps
  # (jamais en clair ici) — mot de passe SA du conteneur mssql ci-dessus, doit respecter la
  # politique de complexité SQL Server par défaut.

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: Install Node.js

  - script: npm ci --legacy-peer-deps
    workingDirectory: src/Frontend/factutrust-web
    displayName: Install frontend dependencies

  - script: npx playwright install --with-deps chromium
    workingDirectory: src/Frontend/factutrust-web
    displayName: Install Playwright Chromium

  - script: npm run test:erp-i18n
    workingDirectory: src/Frontend/factutrust-web
    displayName: ERP i18n guards (copy + CSS)

  - script: npm run i18n:codemod:test && npm run i18n:ids && node scripts/i18n/build-runtime-translations.mjs --strict && npm run i18n:check && node --test scripts/i18n/translation-rules.test.mjs scripts/i18n/review-csv.test.mjs && node scripts/i18n/gate/check-concat-messages.mjs && node scripts/i18n/gate/check-ai-payload-messages.mjs && npm run i18n:values && npm run i18n:rtl:check && node scripts/i18n/codemod/localize-bound-literals.mjs --check
    workingDirectory: src/Frontend/factutrust-web
    displayName: ERP i18n runtime JSON (compile + check)

  - script: npx playwright test --project=chromium
    workingDirectory: src/Frontend/factutrust-web
    displayName: Run Playwright tests

  - script: |
      curl -fL --retry 3 "https://github.com/trunk-io/analytics-cli/releases/latest/download/trunk-analytics-cli-x86_64-unknown-linux.tar.gz" | tar -xz
      chmod +x trunk-analytics-cli
      ./trunk-analytics-cli upload --junit-paths "src/Frontend/factutrust-web/e2e/test-results/junit.xml" \
        --org-url-slug $(TRUNK_ORG_URL_SLUG) \
        --token $(TRUNK_API_TOKEN)
    condition: always()
    displayName: Upload test results to Trunk.io
    env:
      TRUNK_API_TOKEN: $(TRUNK_API_TOKEN)
      TRUNK_ORG_URL_SLUG: $(TRUNK_ORG_URL_SLUG)

  # --- Backend .NET : build + tests SQL réels (tâche 5) ---------------------------------------
  - task: UseDotNet@2
    inputs:
      packageType: sdk
      version: 8.0.x
    displayName: Install .NET 8 SDK

  - script: dotnet build src/Backend/FactuTrust.sln --configuration Release
    displayName: Backend build

  - script: |
      # mssql-tools18 n'est pas préinstallé sur l'image ubuntu-latest : on l'ajoute ici (dépôt
      # Microsoft officiel) plutôt que de dépendre d'un binaire déjà présent sur l'agent.
      if ! command -v sqlcmd >/dev/null 2>&1 && [ ! -x /opt/mssql-tools18/bin/sqlcmd ]; then
        curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
        curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
        sudo apt-get update
        ACCEPT_EULA=Y sudo apt-get install -y mssql-tools18 unixodbc-dev
      fi
      SQLCMD=$(command -v sqlcmd || echo /opt/mssql-tools18/bin/sqlcmd)
      for i in $(seq 1 30); do
        "$SQLCMD" -S localhost,1433 -U sa -P "$(SqlSaPassword)" -C -Q "SELECT 1" -b -l 2 && exit 0
        sleep 2
      done
      echo "SQL Server indisponible après 60 s" && exit 1
    displayName: Attendre la disponibilité de SQL Server

  - script: dotnet test src/Backend/tests/FactuTrust.Infrastructure.Tests/FactuTrust.Infrastructure.Tests.csproj --configuration Release --no-build --verbosity minimal
    displayName: Backend tests (SQL réel)
    env:
      FACTUTRUST_TEST_SQL_CONNECTION: 'Server=localhost,1433;User Id=sa;Password=$(SqlSaPassword);TrustServerCertificate=True;'

  # Contrats HTTP Studio (R22 / C6 du plan Studio IA). Filtre volontaire : les classes
  # WebApplicationFactory du projet (Auth*, Platform*IntegrationTests…) exigent LocalDB, absent sous
  # Linux (« LocalDB is not supported on this platform ») ; elles tournent dans le workflow GitHub
  # `CI` (windows-latest), qui exécute le projet complet.
  - script: dotnet test src/Backend/tests/FactuTrust.API.Tests/FactuTrust.API.Tests.csproj --configuration Release --no-build --verbosity minimal --filter "FullyQualifiedName~FactuTrust.API.Tests.Studio"
    displayName: Backend tests (API — contrats HTTP Studio)
