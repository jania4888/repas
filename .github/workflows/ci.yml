name: CI

# checkout/setup-node utilisent Node.js 24 ; les builds applicatifs restent sur Node.js 20.
# Avant de pousser, passer la porte locale : scripts/verify-all.ps1 (mêmes étapes, plus
# la parité sectorielle). Un run complet coûte ~47 minutes facturées — voir ci-dessous.
#
# Secrets GitHub requis :
#   CI_SQL_SA_PASSWORD — mot de passe SA SQL Server (politique de complexité Microsoft).
#   TRUNK_API_TOKEN — token organisation Trunk (Settings → Organization → General) pour Flaky Tests.
#
# Coût mesuré sur le dernier run vert (2026-09-06) : backend Windows 16,1 min facturées ×2
# = 32,1, plus 15,3 min d'Ubuntu, soit ~47,4 min par run. Sur un dépôt privé en plan Free
# (2 000 min/mois), cela fait ~42 runs mensuels : d'où le filtre de chemins et le groupe
# de concurrence ci-dessous.

# Un changement purement documentaire ne déclenche pas les 47 minutes. La liste est
# répétée volontairement : GitHub Actions n'expanse PAS les ancres YAML (`&`/`*`), un
# workflow qui en contient est refusé au parsing.
#
# ATTENTION : si ce dépôt passe un jour en GitHub Pro avec des checks OBLIGATOIRES,
# `paths-ignore` fait apparaître un check « en attente » qui ne se résout jamais et
# bloque le merge. Aujourd'hui aucune protection de branche n'est possible (compte
# personnel + dépôt privé + plan Free), donc le piège ne s'applique pas.
on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'art/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'art/**'

# Un nouveau push sur une PR annule le run précédent de la même référence, encore en cours :
# sur une branche active, c'est le poste d'économie le plus net.
#
# La condition porte sur l'ÉVÉNEMENT, pas sur le nom de la branche : un run déclenché par un
# push n'est jamais annulé, ni sur `main` ni sur `master` (les deux sont dans le déclencheur
# ci-dessus). On veut pouvoir dire quelle fusion a cassé quoi — une histoire d'intégration
# trouée par des annulations ne vaut pas les minutes qu'elle économise.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend .NET (build + tests)
    runs-on: windows-latest # LocalDB requis par les tests d'intégration API
    env:
      FACTUTRUST_TEST_MASTER_CONNECTION: Server=(localdb)\MSSQLLocalDB;Database=FactuTrust_Master_CI;Trusted_Connection=True;TrustServerCertificate=True;MultipleActiveResultSets=true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Démarrer LocalDB
        run: sqllocaldb start MSSQLLocalDB
      - name: Valider appsettings.Production.json (JSON strict, comme au boot Docker)
        shell: pwsh
        run: |
          Get-Content src/Backend/FactuTrust.API/appsettings.Production.json -Raw | ConvertFrom-Json | Out-Null
      - name: Build
        run: dotnet build src/Backend/FactuTrust.sln --configuration Release
      # Do not define JWT/signature keys at process scope: WebApplicationFactory
      # tests provide their own keys, including negative startup-validation cases.
      # Environment variables have higher precedence than the factories' in-memory
      # configuration and would invalidate those tests (or make forged JWTs return 401).
      # Both test projects share one LocalDB server, even with per-test databases.
      # Serialize projects (-m:1) AND xUnit collections to avoid concurrent SQL
      # provisioning/login bursts. Either control alone still allows overlap.
      # This only changes test scheduling: competing connections/tasks inside a
      # concurrency test still run concurrently; no test, retry or timeout changes.
      - name: Tests
        run: dotnet test src/Backend/FactuTrust.sln --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=backend-tests.trx" -m:1 -- xUnit.ParallelizeTestCollections=false
      - name: Upload backend test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: "**/backend-tests.trx"
          retention-days: 7

  frontend-web:
    name: Web Angular (specs + build prod)
    runs-on: ubuntu-24.04 # épinglé : `ubuntu-latest` bascule sur Ubuntu 26 le 2026-10-19
    defaults:
      run:
        working-directory: src/Frontend/factutrust-web
    steps:
      - uses: actions/checkout@v7
        with:
          # Historique complet : la parité du français se mesure au point de divergence avec main.
          fetch-depth: 0
      - name: Lockfile aligné sur le build Docker (node:20-alpine)
        run: |
          # Le conteneur tourne avec l'UID du runner : sinon node_modules appartient à root et le
          # `npm ci` suivant (côté hôte) échoue avec EACCES en le supprimant.
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/work" -w /work node:20-alpine \
            sh -c "npm ci --legacy-peer-deps"
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/Frontend/factutrust-web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: i18n — ID uniques, catalogue arabe validé (placeholders, taille), traductions
        run: npm run i18n:ids && node scripts/i18n/build-runtime-translations.mjs --strict && npm run i18n:check
      - name: i18n — règles, codemods, phrases découpées, payloads IA, valeurs, CSS RTL, attributs de templates
        run: |
          node --test scripts/i18n/translation-rules.test.mjs scripts/i18n/review-csv.test.mjs
          npm run i18n:codemod:test
          node scripts/i18n/gate/check-concat-messages.mjs
          node scripts/i18n/gate/check-ai-payload-messages.mjs
          npm run i18n:values
          npm run i18n:rtl:check
          node scripts/i18n/codemod/localize-bound-literals.mjs --check
      - name: i18n — parité du français (branches i18n/*)
        if: startsWith(github.head_ref || github.ref_name, 'i18n/')
        run: |
          export I18N_FR_REFERENCE="$(git merge-base HEAD origin/main)"
          npm run i18n:parity:template && npm run i18n:parity:ts
      - name: Audit npm (critical)
        run: npm audit --audit-level=critical
      # Ferme la 2e moitié du contrat de parité : sector-catalog-parity.spec.ts épingle le
      # catalogue statique frontend contre sa COPIE du snapshot backend, mais ne peut pas
      # atteindre le fichier backend (hors du rootDir Angular). Ce script compare la copie
      # au fichier qui fait foi — sans lui, une dérive entre les deux arbres passe inaperçue.
      - name: Parité catalogue sectoriel (backend ↔ fixture frontend)
        run: node ../../../scripts/ci/check-sector-catalog-parity.mjs
      # Gardes landing (lot D) : texte en dur interdit hors dictionnaires, CSS logique (RTL-safe).
      - name: Gardes landing (copy + CSS physique)
        run: npm run test:landing
      - name: Specs Jasmine (headless)
        # Heap Node élargi : le bundling de test dépasse la limite par défaut (~2 Gio)
        # et plantait en OOM (exit 134) pendant « Generating browser application bundles ».
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx ng test --watch=false --browsers=ChromeHeadless
      - name: Build production
        run: npm run build:prod

  frontend-web-e2e-smoke:
    name: Web Playwright smoke
    runs-on: ubuntu-24.04 # épinglé : `ubuntu-latest` bascule sur Ubuntu 26 le 2026-10-19
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD }}
        ports:
          - 1433:1433
    env:
      CI_SQL_SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD }}
      FACTUTRUST_TEST_EMAIL: ci-e2e-smoke@factutrust.local
      FACTUTRUST_TEST_PASSWORD: Ci_E2e_Smoke_Pw1!Xy
      # The API is bound to loopback HTTP inside the ephemeral runner. Avoid
      # `dotnet dev-certs --trust`, which is interactive/unsupported on Linux CI.
      E2E_API_BASE: http://localhost:7000
      ConnectionStrings__MasterConnection: Server=localhost,1433;Database=FactuTrust_Master;User Id=sa;Password=${{ secrets.CI_SQL_SA_PASSWORD }};TrustServerCertificate=True;Encrypt=True
      ConnectionStrings__DefaultTenantConnection: Server=localhost,1433;Database=FactuTrust_Tenant_Default;User Id=sa;Password=${{ secrets.CI_SQL_SA_PASSWORD }};TrustServerCertificate=True;Encrypt=True
    defaults:
      run:
        working-directory: src/Frontend/factutrust-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/Frontend/factutrust-web/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Wait for SQL Server
        run: bash scripts/ci/wait-for-sql.sh
        working-directory: .
      - name: Build backend
        run: dotnet build src/Backend/FactuTrust.sln --configuration Release
        working-directory: .
      - name: Start API for e2e
        run: bash scripts/ci/start-api-e2e.sh
        working-directory: .
      - name: Register CI test user
        run: bash scripts/ci/e2e-register-user.sh
        working-directory: .
      - name: Upload API e2e log on failure
        if: failure()
        run: |
          if [ -f api-e2e.log ]; then
            sed -E 's/(Password=)[^;]*/\1***REDACTED***/gi' api-e2e.log > api-e2e-sanitized.log
          fi
        working-directory: .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: api-e2e-log
          path: api-e2e-sanitized.log
          retention-days: 7
        continue-on-error: true
      - name: Verify API listens on loopback HTTP only
        run: |
          mapfile -t listeners < <(sed -n 's/^.*Now listening on: //p' api-e2e.log)
          if [[ ${#listeners[@]} -ne 1 || "${listeners[0]:-}" != "http://localhost:7000" ]]; then
            echo "Expected exactly one API listener at http://localhost:7000; found:" >&2
            printf '  %s\n' "${listeners[@]:-<none>}" >&2
            exit 1
          fi
        working-directory: .
      - run: npm ci --legacy-peer-deps
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke e2e (Chromium)
        run: npx playwright test e2e/sidebar-collapse.spec.ts e2e/test-backend-connection.spec.ts e2e/landing-smoke.spec.ts e2e/landing-cabinets.spec.ts e2e/landing-contact.spec.ts e2e/landing-i18n.spec.ts e2e/accounting/bank-statement-import.spec.ts --project=chromium
      - name: Upload Test Results to Trunk.io
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: trunk-io/analytics-uploader@v2
        with:
          junit-paths: src/Frontend/factutrust-web/e2e/test-results/junit.xml
          org-slug: instafact
          token: ${{ secrets.TRUNK_API_TOKEN }}
        env:
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}

  frontend-backoffice:
    name: Backoffice Angular (build)
    runs-on: ubuntu-24.04 # épinglé : `ubuntu-latest` bascule sur Ubuntu 26 le 2026-10-19
    defaults:
      run:
        working-directory: src/Frontend/factutrust-backoffice
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/Frontend/factutrust-backoffice/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Audit npm (critical)
        run: npm audit --audit-level=critical
      - name: Build production
        run: npx ng build --configuration production
