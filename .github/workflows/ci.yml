name: CI

# checkout/setup-node utilisent Node.js 24 ; les builds applicatifs restent sur Node.js 20.
# Dépôt actuellement sans remote : ce workflow s'activera automatiquement
# dès que le dépôt sera poussé sur GitHub. En attendant, utiliser
# scripts/verify-all.ps1 en local (mêmes étapes).
#
# Secrets GitHub requis :
#   CI_SQL_SA_PASSWORD — mot de passe SA SQL Server (politique de complexité Microsoft).
#   TRUNK_API_TOKEN — token organisation Trunk (Settings → Organization → General) pour Flaky Tests.
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend .NET (build + tests)
    runs-on: windows-latest # LocalDB requis par les tests d'intégration API
    env:
      FACTUTRUST_TEST_MASTER_CONNECTION: Server=(localdb)\MSSQLLocalDB;Database=FactuTrust_Master_CI;Trusted_Connection=True;TrustServerCertificate=True;MultipleActiveResultSets=true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Démarrer LocalDB
        run: sqllocaldb start MSSQLLocalDB
      - name: Build
        run: dotnet build src/Backend/FactuTrust.sln --configuration Release
      # Do not define JWT/signature keys at process scope: WebApplicationFactory
      # tests provide their own keys, including negative startup-validation cases.
      # Environment variables have higher precedence than the factories' in-memory
      # configuration and would invalidate those tests (or make forged JWTs return 401).
      # Both test projects share one LocalDB server, even with per-test databases.
      # Serialize projects (-m:1) AND xUnit collections to avoid concurrent SQL
      # provisioning/login bursts. Either control alone still allows overlap.
      # This only changes test scheduling: competing connections/tasks inside a
      # concurrency test still run concurrently; no test, retry or timeout changes.
      - name: Tests
        run: dotnet test src/Backend/FactuTrust.sln --configuration Release --no-build --verbosity minimal --logger "trx;LogFileName=backend-tests.trx" -m:1 -- xUnit.ParallelizeTestCollections=false
      - name: Upload backend test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: "**/backend-tests.trx"
          retention-days: 7

  frontend-web:
    name: Web Angular (specs + build prod)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Frontend/factutrust-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/Frontend/factutrust-web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Audit npm (critical)
        run: npm audit --audit-level=critical
      # Ferme la 2e moitié du contrat de parité : sector-catalog-parity.spec.ts épingle le
      # catalogue statique frontend contre sa COPIE du snapshot backend, mais ne peut pas
      # atteindre le fichier backend (hors du rootDir Angular). Ce script compare la copie
      # au fichier qui fait foi — sans lui, une dérive entre les deux arbres passe inaperçue.
      - name: Parité catalogue sectoriel (backend ↔ fixture frontend)
        run: node ../../../scripts/ci/check-sector-catalog-parity.mjs
      - name: Specs Jasmine (headless)
        run: npx ng test --watch=false --browsers=ChromeHeadless
      - name: Build production
        run: npm run build:prod

  frontend-web-e2e-smoke:
    name: Web Playwright smoke
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD }}
        ports:
          - 1433:1433
    env:
      CI_SQL_SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD }}
      FACTUTRUST_TEST_EMAIL: ci-e2e-smoke@factutrust.local
      FACTUTRUST_TEST_PASSWORD: Ci_E2e_Smoke_Pw1!Xy
      # The API is bound to loopback HTTP inside the ephemeral runner. Avoid
      # `dotnet dev-certs --trust`, which is interactive/unsupported on Linux CI.
      E2E_API_BASE: http://localhost:7000
      ConnectionStrings__MasterConnection: Server=localhost,1433;Database=FactuTrust_Master;User Id=sa;Password=${{ secrets.CI_SQL_SA_PASSWORD }};TrustServerCertificate=True;Encrypt=True
      ConnectionStrings__DefaultTenantConnection: Server=localhost,1433;Database=FactuTrust_Tenant_Default;User Id=sa;Password=${{ secrets.CI_SQL_SA_PASSWORD }};TrustServerCertificate=True;Encrypt=True
    defaults:
      run:
        working-directory: src/Frontend/factutrust-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/Frontend/factutrust-web/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Wait for SQL Server
        run: bash scripts/ci/wait-for-sql.sh
        working-directory: .
      - name: Build backend
        run: dotnet build src/Backend/FactuTrust.sln --configuration Release
        working-directory: .
      - name: Start API for e2e
        run: bash scripts/ci/start-api-e2e.sh
        working-directory: .
      - name: Register CI test user
        run: bash scripts/ci/e2e-register-user.sh
        working-directory: .
      - name: Upload API e2e log on failure
        if: failure()
        run: |
          if [ -f api-e2e.log ]; then
            sed -E 's/(Password=)[^;]*/\1***REDACTED***/gi' api-e2e.log > api-e2e-sanitized.log
          fi
        working-directory: .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: api-e2e-log
          path: api-e2e-sanitized.log
          retention-days: 7
        continue-on-error: true
      - name: Verify API listens on loopback HTTP only
        run: |
          mapfile -t listeners < <(sed -n 's/^.*Now listening on: //p' api-e2e.log)
          if [[ ${#listeners[@]} -ne 1 || "${listeners[0]:-}" != "http://localhost:7000" ]]; then
            echo "Expected exactly one API listener at http://localhost:7000; found:" >&2
            printf '  %s\n' "${listeners[@]:-<none>}" >&2
            exit 1
          fi
        working-directory: .
      - run: npm ci --legacy-peer-deps
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke e2e (Chromium)
        run: npx playwright test e2e/sidebar-collapse.spec.ts e2e/test-backend-connection.spec.ts --project=chromium
      - name: Upload Test Results to Trunk.io
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: trunk-io/analytics-uploader@v2
        with:
          junit-paths: src/Frontend/factutrust-web/e2e/test-results/junit.xml
          org-slug: instafact
          token: ${{ secrets.TRUNK_API_TOKEN }}
        env:
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}

  frontend-backoffice:
    name: Backoffice Angular (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Frontend/factutrust-backoffice
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/Frontend/factutrust-backoffice/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Audit npm (critical)
        run: npm audit --audit-level=critical
      - name: Build production
        run: npx ng build --configuration production
